<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishi Karya — AI-enabled agricultural procurement</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7F4E9;
  --cream-alt:#FBF9F2;
  --sage:#E7F0DD;
  --sage-2:#DCEBD0;
  --forest:#1F4A2C;
  --forest-2:#163A22;
  --leaf:#3C7A46;
  --leaf-2:#2F6B3D;
  --amber:#DFA23A;
  --amber-2:#C98F2B;
  --ink:#202A1F;
  --ink-muted:#5B6B5A;
  --ink-soft:#7C8A79;
  --white:#FFFFFF;
  --line:#E3DFD0;
  --danger:#B5432E;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:26px;
  --shadow-card:0 1px 2px rgba(31,74,44,.06), 0 8px 24px rgba(31,74,44,.07);
  --font-serif:'Playfair Display', 'Noto Sans Devanagari', Georgia, serif;
  --font-sans:'Inter', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, sans-serif;
}
:root[data-theme="dark"]{
  --cream:#141912;
  --cream-alt:#1A2117;
  --sage:#1B2A1C;
  --sage-2:#20301F;
  --forest:#12240E;
  --forest-2:#0D1A0A;
  --leaf:#7FBF7A;
  --leaf-2:#93CE8C;
  --amber:#E7B563;
  --amber-2:#F0C57C;
  --ink:#EDEFE7;
  --ink-muted:#B7C0AF;
  --ink-soft:#8C978A;
  --white:#1E2A1B;
  --line:#2B3728;
  --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#141912;
    --cream-alt:#1A2117;
    --sage:#1B2A1C;
    --sage-2:#20301F;
    --forest:#12240E;
    --forest-2:#0D1A0A;
    --leaf:#7FBF7A;
    --leaf-2:#93CE8C;
    --amber:#E7B563;
    --amber-2:#F0C57C;
    --ink:#EDEFE7;
    --ink-muted:#B7C0AF;
    --ink-soft:#8C978A;
    --white:#1E2A1B;
    --line:#2B3728;
    --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  overflow-x:hidden;
}
body.lang-hi{ }
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
h1,h2,h3,h4{font-family:var(--font-serif);color:var(--forest);margin:0;line-height:1.15;font-weight:700;}
:root[data-theme="dark"] h1, :root[data-theme="dark"] h2, :root[data-theme="dark"] h3, :root[data-theme="dark"] h4{color:var(--leaf-2);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) h1, :root:not([data-theme="light"]) h2, :root:not([data-theme="light"]) h3, :root:not([data-theme="light"]) h4{color:var(--leaf-2);}
}
p{margin:0;}
.container{max-width:1240px;margin:0 auto;padding:0 32px;}
@media (max-width:700px){ .container{padding:0 18px;} }

/* wide content scroll safety */
.scroll-x{overflow-x:auto;}

/* ---------- Header ---------- */
header.site-header{
  position:sticky;top:0;z-index:60;
  background:var(--cream-alt);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1240px;margin:0 auto;padding:14px 32px;
  display:flex;align-items:center;gap:28px;
}
@media (max-width:700px){ .header-inner{padding:12px 18px;gap:12px;} }
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0;}
.brand-mark{
  width:38px;height:38px;border-radius:50%;
  background:var(--forest);color:var(--white);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-name{font-family:var(--font-serif);font-weight:700;font-size:1.2rem;color:var(--forest);}
.brand-tag{font-size:.72rem;color:var(--ink-muted);margin-top:-2px;}
nav.main-nav{display:flex;align-items:center;gap:22px;flex:1;}
nav.main-nav a, .nav-dd > button{
  font-size:.95rem;color:var(--ink);background:none;border:none;cursor:pointer;
  padding:8px 2px;display:flex;align-items:center;gap:5px;white-space:nowrap;
}
nav.main-nav a:hover, .nav-dd>button:hover{color:var(--leaf-2);}
nav.main-nav a.active{color:var(--forest);font-weight:600;}
.nav-dd{position:relative;}
.nav-dd-panel{
  position:absolute;top:calc(100% + 6px);left:0;background:var(--white);
  border:1px solid var(--line);border-radius:var(--radius-s);box-shadow:var(--shadow-card);
  min-width:200px;padding:6px;display:none;flex-direction:column;z-index:50;
}
.nav-dd.open .nav-dd-panel{display:flex;}
.nav-dd-panel a{padding:10px 12px;border-radius:8px;font-size:.92rem;}
.nav-dd-panel a:hover, .nav-dd-panel a.active{background:var(--sage);color:var(--forest);}
.header-actions{display:flex;align-items:center;gap:14px;margin-left:auto;flex-shrink:0;}
.icon-btn{
  background:none;border:none;cursor:pointer;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:6px;border-radius:8px;
  position:relative;
}
.icon-btn:hover{background:var(--sage);}
.cart-badge{
  position:absolute;top:-2px;right:-2px;background:var(--amber-2);color:#2b1c00;
  font-size:.62rem;font-weight:700;min-width:16px;height:16px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}
.lang-toggle{
  display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;
  color:var(--ink);font-size:.88rem;font-weight:600;padding:8px 10px;border-radius:20px;
}
.lang-toggle:hover{background:var(--sage);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:600;font-size:.92rem;border-radius:30px;border:1px solid transparent;
  padding:11px 22px;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--forest);color:#fff;}
.btn-primary:hover{background:var(--forest-2);}
.btn-amber{background:var(--amber);color:#2b1c00;}
.btn-amber:hover{background:var(--amber-2);}
.btn-outline{background:transparent;border-color:var(--forest);color:var(--forest);}
.btn-outline:hover{background:var(--sage);}
.btn-sm{padding:8px 16px;font-size:.85rem;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* mobile nav */
.burger{display:none;background:none;border:none;cursor:pointer;padding:6px;}
@media (max-width:980px){
  nav.main-nav{display:none;}
  .burger{display:flex;}
  .header-actions .lang-toggle span.lang-label{display:none;}
}
.mobile-nav{
  display:none;flex-direction:column;background:var(--cream-alt);border-top:1px solid var(--line);
  padding:8px 18px 18px;
}
.mobile-nav.open{display:flex;}
.mobile-nav a, .mobile-nav button.mn-parent{
  padding:12px 4px;border-bottom:1px solid var(--line);font-size:1rem;background:none;border-left:none;border-right:none;border-top:none;text-align:left;width:100%;color:var(--ink);cursor:pointer;
}
.mobile-sub{padding-left:14px;display:flex;flex-direction:column;}
.mobile-sub a{border-bottom:1px dashed var(--line);color:var(--ink-muted);}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;background:var(--forest);}
.hero-bg{position:absolute;inset:0;z-index:0;}
.hero-bg svg{width:100%;height:100%;display:block;}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(100deg, rgba(18,40,20,.92) 0%, rgba(28,64,32,.72) 42%, rgba(60,110,50,.28) 75%, rgba(110,150,60,.12) 100%);}
.hero-inner{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:76px 32px 64px;}
@media (max-width:700px){ .hero-inner{padding:40px 18px 40px;} }
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:#2b1c00;
  font-size:.82rem;font-weight:600;padding:8px 16px;border-radius:30px;margin-bottom:26px;
}
.hero h1{
  color:#fff;font-size:clamp(2.1rem, 5vw, 3.4rem);max-width:820px;margin-bottom:22px;
}
.hero p.lede{
  color:#EAF1E4;font-size:1.08rem;max-width:560px;margin-bottom:34px;
}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap;}

/* feature strip overlapping hero bottom */
.feature-strip-wrap{position:relative;z-index:3;}
.feature-strip{
  max-width:1240px;margin:0 auto;background:var(--white);border-radius:var(--radius-m);
  box-shadow:var(--shadow-card);display:grid;grid-template-columns:repeat(4,1fr);
  transform:translateY(-46px);margin-bottom:-30px;
  border:1px solid var(--line);
}
@media (max-width:940px){ .feature-strip{grid-template-columns:repeat(2,1fr);} }
@media (max-width:560px){ .feature-strip{grid-template-columns:1fr;transform:translateY(-24px);margin-bottom:-8px;} }
.feature-item{
  padding:26px 24px;display:flex;flex-direction:column;gap:10px;
  border-right:1px solid var(--line);
}
.feature-item:last-child{border-right:none;}
@media (max-width:940px){ .feature-item:nth-child(2){border-right:none;} .feature-item:nth-child(odd){border-right:1px solid var(--line);} }
@media (max-width:560px){ .feature-item{border-right:none !important;border-bottom:1px solid var(--line);} .feature-item:last-child{border-bottom:none;} }
.feature-icon{
  width:40px;height:40px;border-radius:50%;background:var(--sage);color:var(--leaf-2);
  display:flex;align-items:center;justify-content:center;
}
.feature-item h4{font-family:var(--font-sans);font-weight:700;font-size:.98rem;color:var(--ink);}
.feature-item p{font-size:.85rem;color:var(--ink-muted);}

/* ---------- Sections ---------- */
.section{padding:74px 0;}
.section.tight{padding:56px 0;}
.section.alt{background:var(--sage);}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px;flex-wrap:wrap;}
.section-head h2{font-size:clamp(1.6rem,3vw,2.2rem);}
.section-head p{color:var(--ink-muted);margin-top:8px;max-width:560px;}
.view-all{color:var(--leaf-2);font-weight:600;font-size:.94rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.view-all:hover{text-decoration:underline;}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
@media (max-width:980px){ .grid-3{grid-template-columns:repeat(2,1fr);} .grid-4{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .grid-3{grid-template-columns:1fr;} .grid-4{grid-template-columns:1fr;} }

.tool-card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius-m);
  padding:30px 26px;box-shadow:var(--shadow-card);
}
.tool-card .circle-icon{
  width:52px;height:52px;border-radius:50%;background:var(--forest);color:#fff;
  display:flex;align-items:center;justify-content:center;margin-bottom:18px;
}
.tool-card h3{font-size:1.2rem;margin-bottom:10px;}
.tool-card p{color:var(--ink-muted);font-size:.92rem;margin-bottom:18px;}
.tool-card .link-arrow{color:var(--leaf-2);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:0;}
.tool-card .link-arrow:hover{text-decoration:underline;}

.produce-card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius-m);
  overflow:hidden;box-shadow:var(--shadow-card);display:flex;flex-direction:column;
}
.produce-thumb{
  aspect-ratio:4/3;width:100%;position:relative;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg, var(--sage-2), var(--sage));
}
.produce-icon-badge{
  width:74px;height:74px;border-radius:50%;background:var(--white);
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(31,74,44,.12);
  color:var(--forest);
}
.produce-icon-badge svg{width:60%;height:60%;stroke-width:1.9;}
.grade-chip{
  position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);color:var(--forest);
  font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid var(--line);
}
.produce-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1;}
.produce-body h4{font-family:var(--font-sans);font-size:1.02rem;font-weight:700;color:var(--ink);}
.produce-meta{font-size:.82rem;color:var(--ink-muted);}
.produce-price-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.produce-price{font-family:var(--font-serif);font-weight:700;color:var(--forest);font-size:1.15rem;}
.produce-price span{font-family:var(--font-sans);font-weight:500;font-size:.78rem;color:var(--ink-muted);}
.add-cart-btn{
  background:var(--forest);color:#fff;border:none;border-radius:20px;padding:8px 14px;
  font-size:.82rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;
}
.add-cart-btn:hover{background:var(--forest-2);}
.add-cart-btn.added{background:var(--leaf-2);}

/* dual CTA band */
.dual-cta{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media (max-width:760px){ .dual-cta{grid-template-columns:1fr;} }
.dual-cta-card{
  border-radius:var(--radius-l);padding:38px 34px;color:#fff;position:relative;overflow:hidden;
}
.dual-cta-card.farmer{background:linear-gradient(135deg,var(--forest),var(--leaf-2));}
.dual-cta-card.retailer{background:linear-gradient(135deg,#8a5a1d,var(--amber));}
.dual-cta-card h3{color:#fff;font-size:1.5rem;margin-bottom:12px;}
.dual-cta-card p{color:rgba(255,255,255,.88);margin-bottom:22px;max-width:420px;}
.dual-cta-card .btn{background:#fff;color:var(--forest);}
.dual-cta-card.retailer .btn{color:#5c3a10;}

/* ---------- Footer ---------- */
footer.site-footer{background:var(--forest);color:#EAF1E4;padding:56px 0 0;}
:root[data-theme="dark"] footer.site-footer, :root[data-theme="dark"] footer.site-footer h1{background:#0D1A0A;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px;padding-bottom:38px;}
@media (max-width:820px){ .footer-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:520px){ .footer-grid{grid-template-columns:1fr;} }
.footer-brand{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.footer-brand .brand-mark{background:var(--amber);color:#2b1c00;}
.footer-brand-name{font-family:var(--font-serif);font-weight:700;font-size:1.1rem;color:#fff;}
.footer-tagline{color:#B9CBB2;font-size:.88rem;max-width:240px;}
.footer-col h5{color:var(--amber);font-size:.78rem;font-weight:700;letter-spacing:.02em;margin-bottom:16px;text-transform:uppercase;}
.footer-col a, .footer-col p{display:block;color:#D9E5D2;font-size:.92rem;margin-bottom:12px;}
.footer-col a:hover{color:#fff;text-decoration:underline;}
.footer-contact-item{display:flex;align-items:flex-start;gap:8px;}
.footer-bottom{border-top:1px solid rgba(255,255,255,.14);padding:18px 0;text-align:center;font-size:.82rem;color:#AABF9F;}

/* ---------- Page header (inner pages) ---------- */
.page-head{padding:44px 0 30px;}
.page-head h1{font-size:clamp(1.8rem,3.4vw,2.5rem);margin-bottom:10px;}
.page-head p{color:var(--ink-muted);font-size:1rem;max-width:560px;}
.breadcrumb{font-size:.82rem;color:var(--ink-soft);margin-bottom:14px;display:flex;gap:6px;align-items:center;}
.breadcrumb a:hover{color:var(--leaf-2);}

/* ---------- Marketplace ---------- */
.marketplace-layout{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:flex-start;padding-bottom:70px;}
@media (max-width:860px){ .marketplace-layout{grid-template-columns:1fr;} }
.filters-panel{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius-m);
  padding:24px;position:sticky;top:88px;box-shadow:var(--shadow-card);
}
.filters-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;margin-bottom:20px;color:var(--ink);}
.field-group{margin-bottom:18px;}
.field-group label{display:block;font-size:.84rem;font-weight:600;margin-bottom:7px;color:var(--ink);}
.field-input, select.field-input{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:.9rem;font-family:inherit;background:var(--cream-alt);color:var(--ink);
}
.field-input:focus, select.field-input:focus{outline:2px solid var(--leaf-2);outline-offset:1px;border-color:var(--leaf-2);}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:.8rem;
  background:var(--cream-alt);cursor:pointer;color:var(--ink);
}
.chip.active{background:var(--forest);color:#fff;border-color:var(--forest);}
.clear-filters{font-size:.85rem;color:var(--leaf-2);background:none;border:none;cursor:pointer;padding:0;margin-top:6px;}
.clear-filters:hover{text-decoration:underline;}
.results-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.results-count{color:var(--ink-muted);font-size:.9rem;}
.sort-row{display:flex;align-items:center;gap:8px;font-size:.88rem;}
.market-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
@media (max-width:1080px){ .market-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .market-grid{grid-template-columns:1fr;} }
.empty-state{
  background:var(--white);border:1px dashed var(--line);border-radius:var(--radius-m);
  padding:60px 20px;text-align:center;color:var(--ink-muted);
}

/* ---------- AI tool page ---------- */
.ai-layout{display:grid;grid-template-columns:1fr 1fr;gap:26px;padding-bottom:70px;align-items:start;}
@media (max-width:860px){ .ai-layout{grid-template-columns:1fr;} }
.dropzone{
  border:2px dashed var(--line);border-radius:var(--radius-m);background:var(--cream-alt);
  min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:30px;cursor:pointer;transition:border-color .15s, background .15s;
  position:relative;overflow:hidden;
}
.dropzone.drag{border-color:var(--leaf-2);background:var(--sage);}
.dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.dropzone .upload-icon{color:var(--leaf-2);margin-bottom:16px;}
.dropzone h4{font-family:var(--font-sans);font-weight:600;font-size:1.05rem;margin-bottom:8px;color:var(--ink);}
.dropzone p{font-size:.85rem;color:var(--ink-muted);}
.dropzone img.preview{max-height:380px;border-radius:12px;object-fit:contain;}
.results-panel{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius-m);
  min-height:420px;padding:26px;box-shadow:var(--shadow-card);
}
.results-empty{color:var(--ink-muted);font-size:.95rem;}
.analyzing{display:flex;align-items:center;gap:12px;color:var(--ink-muted);font-size:.95rem;}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--leaf-2);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.result-card{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;}
.result-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.result-title{font-weight:700;font-size:1.05rem;color:var(--ink);}
.result-badge{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:20px;}
.badge-good{background:#DDF0D8;color:#28611F;}
:root[data-theme="dark"] .badge-good{background:#20351D;color:#9BDB8E;}
.badge-warn{background:#FBEBD0;color:#8A5A0E;}
:root[data-theme="dark"] .badge-warn{background:#3A2E14;color:#F0C57C;}
.badge-bad{background:#F6DCD5;color:#95311D;}
:root[data-theme="dark"] .badge-bad{background:#3A1F19;color:#EF9C86;}
.confidence-row{margin:10px 0;}
.confidence-bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px;}
.confidence-fill{height:100%;background:var(--leaf-2);}
.result-detail-row{display:flex;justify-content:space-between;font-size:.86rem;padding:6px 0;border-top:1px dashed var(--line);color:var(--ink-muted);}
.result-detail-row span:last-child{color:var(--ink);font-weight:600;}
.rec-box{background:var(--sage);border-radius:10px;padding:12px 14px;font-size:.86rem;margin-top:12px;color:var(--ink);}
.history-thumb-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.history-thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:pointer;opacity:.7;}
.history-thumb.active{opacity:1;outline:2px solid var(--leaf-2);}

/* ---------- Cart ---------- */
.cart-table{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;}
.cart-table th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:14px 16px;background:var(--cream-alt);border-bottom:1px solid var(--line);}
.cart-table td{padding:16px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.92rem;}
.cart-item-name{display:flex;align-items:center;gap:12px;}
.cart-item-name .thumb{width:52px;height:52px;border-radius:10px;background:var(--sage-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qty-stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:20px;width:fit-content;}
.qty-stepper button{background:none;border:none;width:28px;height:28px;cursor:pointer;font-size:1rem;color:var(--ink);}
.qty-stepper span{min-width:22px;text-align:center;font-size:.9rem;}
.remove-link{color:var(--danger);font-size:.82rem;background:none;border:none;cursor:pointer;padding:0;}
.remove-link:hover{text-decoration:underline;}
.cart-summary{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius-m);padding:24px;
  box-shadow:var(--shadow-card);
}
.cart-summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:.92rem;color:var(--ink-muted);}
.cart-summary-row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-weight:700;color:var(--ink);font-size:1.05rem;}
.cart-layout{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start;padding-bottom:70px;}
@media (max-width:820px){ .cart-layout{grid-template-columns:1fr;} }

/* ---------- How it works ---------- */
.steps-col{display:flex;flex-direction:column;gap:0;}
.step-row{display:flex;gap:18px;padding:22px 0;border-bottom:1px solid var(--line);}
.step-row:last-child{border-bottom:none;}
.step-num{
  width:36px;height:36px;border-radius:50%;background:var(--forest);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-family:var(--font-serif);
}
.step-row h4{font-size:1.05rem;margin-bottom:6px;color:var(--ink);font-family:var(--font-sans);font-weight:700;}
.step-row p{color:var(--ink-muted);font-size:.9rem;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:44px;}
@media (max-width:820px){ .two-col{grid-template-columns:1fr;gap:30px;} }

/* ---------- About ---------- */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:40px 0;}
@media (max-width:760px){ .stats-row{grid-template-columns:repeat(2,1fr);} }
.stat-box{text-align:center;padding:22px 10px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius-m);}
.stat-box .num{font-family:var(--font-serif);font-size:2rem;font-weight:700;color:var(--forest);}
.stat-box .label{font-size:.82rem;color:var(--ink-muted);margin-top:4px;}
.about-story p{margin-bottom:16px;color:var(--ink-muted);max-width:720px;}
.about-story{margin-bottom:10px;}

/* ---------- Contact ---------- */
.contact-layout{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding-bottom:70px;}
@media (max-width:820px){ .contact-layout{grid-template-columns:1fr;} }
.contact-info-item{display:flex;gap:14px;margin-bottom:22px;align-items:flex-start;}
.contact-info-item .ic{width:42px;height:42px;border-radius:50%;background:var(--sage);color:var(--leaf-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.contact-info-item h5{font-size:.95rem;margin-bottom:3px;color:var(--ink);}
.contact-info-item p{font-size:.88rem;color:var(--ink-muted);}
.form-row{margin-bottom:16px;}
.form-row label{display:block;font-size:.86rem;font-weight:600;margin-bottom:6px;}
.form-row input, .form-row textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-family:inherit;
  font-size:.92rem;background:var(--cream-alt);color:var(--ink);
}
.form-row textarea{resize:vertical;min-height:110px;}
.form-row input:focus, .form-row textarea:focus{outline:2px solid var(--leaf-2);outline-offset:1px;border-color:var(--leaf-2);}
.success-msg{background:var(--sage);border:1px solid var(--leaf-2);color:var(--forest);padding:14px 16px;border-radius:10px;font-size:.9rem;margin-bottom:16px;}

/* ---------- 404 ---------- */
.notfound{text-align:center;padding:100px 20px;}
.notfound .code{font-family:var(--font-serif);font-size:5rem;font-weight:800;color:var(--forest);margin-bottom:6px;}
.notfound h3{margin-bottom:10px;}
.notfound p{color:var(--ink-muted);margin-bottom:26px;}

/* ---------- Modal (login) ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,25,18,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--white);border-radius:var(--radius-m);padding:32px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;}
.modal-close{position:absolute;top:14px;right:14px;background:none;border:none;cursor:pointer;color:var(--ink-muted);padding:4px;}
.modal-box h3{margin-bottom:6px;}
.modal-box .sub{color:var(--ink-muted);font-size:.88rem;margin-bottom:22px;}
.modal-tabs{display:flex;gap:4px;background:var(--cream-alt);border-radius:10px;padding:4px;margin-bottom:20px;}
.modal-tabs button{flex:1;border:none;background:none;padding:8px;border-radius:8px;font-size:.86rem;font-weight:600;cursor:pointer;color:var(--ink-muted);}
.modal-tabs button.active{background:var(--white);color:var(--forest);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--forest);color:#fff;padding:13px 22px;border-radius:30px;font-size:.9rem;
  box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:200;opacity:0;pointer-events:none;transition:all .25s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* search overlay */
.search-overlay{position:fixed;inset:0;background:rgba(20,25,18,.5);z-index:90;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;}
.search-overlay.open{display:flex;}
.search-box{background:var(--white);border-radius:var(--radius-m);width:100%;max-width:560px;padding:6px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.search-box input{width:100%;border:none;padding:16px 18px;font-size:1.05rem;font-family:inherit;border-radius:var(--radius-m);background:transparent;color:var(--ink);}
.search-box input:focus{outline:none;}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
:focus-visible{outline:2px solid var(--leaf-2);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important;transition-duration:.01ms !important;} }

function addToCart(id){
  const existing = state.cart.find(c=>c.id===id);
  if(existing){ existing.qty++; } else { state.cart.push({id, qty:1}); }
  saveCart();
  showToast(t('toast_added_cart'));
  render();
}
function removeFromCart(id){
  state.cart = state.cart.filter(c=>c.id!==id);
  saveCart();
  showToast(t('toast_removed_cart'));
  render();
}
function changeQty(id, delta){
  const item = state.cart.find(c=>c.id===id);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0){ removeFromCart(id); return; }
  saveCart();
  render();
}

   AI analysis simulator (deterministic-ish, client only)
   ========================================================= */
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }

const DISEASES = [
  {en:'Healthy — no disease detected', hi:'स्वस्थ — कोई रोग नहीं मिला', badge:'good', sev:{en:'None', hi:'कोई नहीं'}},
  {en:'Early blight (leaf spot)', hi:'प्रारंभिक झुलसा (पत्ती धब्बा)', badge:'warn', sev:{en:'Mild', hi:'हल्की'}},
  {en:'Powdery mildew', hi:'चूर्णिल फफूंदी', badge:'warn', sev:{en:'Moderate', hi:'मध्यम'}},
  {en:'Bacterial soft rot', hi:'जीवाणु मृदु सड़न', badge:'bad', sev:{en:'Severe', hi:'गंभीर'}},
  {en:'Pest damage (aphids)', hi:'कीट क्षति (एफिड्स)', badge:'warn', sev:{en:'Mild', hi:'हल्की'}},
];
const DISEASE_REC = {
  good:{en:'No action needed — crop is fit for market at current grade.', hi:'कोई कार्रवाई आवश्यक नहीं — फसल वर्तमान ग्रेड पर बाज़ार के लिए उपयुक्त है।'},
  warn:{en:'Isolate affected batch and apply recommended treatment before shipping. Safe to sell at a lower grade.', hi:'प्रभावित खेप को अलग करें और भेजने से पहले अनुशंसित उपचार करें। कम ग्रेड पर बेचना सुरक्षित है।'},
  bad:{en:'Do not ship this batch. Remove affected produce and consult a local agronomist immediately.', hi:'इस खेप को न भेजें। प्रभावित उपज हटाएँ और तुरंत स्थानीय कृषि विशेषज्ञ से संपर्क करें।'},
};
const RIPENESS_STAGES = [
  {en:'Underripe', hi:'कच्चा', badge:'warn', window:{en:'Wait 3–5 days before harvest', hi:'कटाई से पहले 3–5 दिन प्रतीक्षा करें'}},
  {en:'Optimal ripeness', hi:'उचित पकाव', badge:'good', window:{en:'Harvest / sell within 1–2 days', hi:'1–2 दिनों के भीतर कटाई/बिक्री करें'}},
  {en:'Overripe', hi:'अधिक पका', badge:'bad', window:{en:'Sell immediately or move to processing', hi:'तुरंत बेचें या प्रसंस्करण में भेजें'}},
];
const GRADES = [
  {g:'A', badge:'good', label:{en:'Grade A — premium retail', hi:'ग्रेड A — प्रीमियम रिटेल'}},
  {g:'B', badge:'warn', label:{en:'Grade B — standard retail', hi:'ग्रेड B — मानक रिटेल'}},
  {g:'C', badge:'bad', label:{en:'Grade C — processing / wholesale only', hi:'ग्रेड C — केवल प्रसंस्करण/थोक'}},
];

function runAnalysis(tool, fileNameSeed){
  const h = hashStr(fileNameSeed + Date.now());
  if(tool==='disease'){
    const d = DISEASES[h % DISEASES.length];
    const confidence = 78 + (h % 20);
    return { kind:'disease', name:d, confidence, severity:d.sev, rec:DISEASE_REC[d.badge] };
  }
  if(tool==='ripeness'){
    const r = RIPENESS_STAGES[h % RIPENESE_LEN()];
    const confidence = 74 + (h % 24);
    const sugar = (8 + (h % 10)) + '–' + (10 + (h % 10)) + ' °Brix';
    return { kind:'ripeness', stage:r, confidence, sugar };
  }
  if(tool==='quality'){
    const g = GRADES[h % GRADES.length];
    const confidence = 80 + (h % 18);
    const uniformity = 70 + (h % 28);
    const surface = 68 + (h % 30);
    const priceMap = {A:'₹26–30 / kg', B:'₹18–22 / kg', C:'₹10–14 / kg'};
    return { kind:'quality', grade:g, confidence, uniformity, surface, price:priceMap[g.g] };
  }
}
function RIPENESE_LEN(){ return RIPENESS_STAGES.length; }

function badgeClass(b){ return 'result-badge badge-' + b; }

function setMarketFilter(key, val){ state.marketFilters[key] = val; render(); }
function clearMarketFilters(){ state.marketFilters = { q:'', category:'all', location:'all', grade:'all', sort:'newest' }; render(); }

function filteredProduce(){
  const f = state.marketFilters;
  const lang = state.lang;
  let list = PRODUCE.filter(p=>{
    if(f.category!=='all' && p.category!==f.category) return false;
    if(f.location!=='all' && p.location!==f.location) return false;
    if(f.grade!=='all' && p.grade!==f.grade) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = (p.name.en+' '+p.name.hi+' '+p.farmer+' '+p.location).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(f.sort==='price_low') list = list.slice().sort((a,b)=>a.price-b.price);
  else if(f.sort==='price_high') list = list.slice().sort((a,b)=>b.price-a.price);
  else if(f.sort==='grade') list = list.slice().sort((a,b)=>a.grade.localeCompare(b.grade));
  else list = list.slice().sort((a,b)=>a.days-b.days);
  return list;
}

function aiToolView(tool){
  const titleKey = {disease:'ai_disease_h', ripeness:'ai_ripeness_h', quality:'ai_quality_h'}[tool];
  const subKey = {disease:'ai_disease_p', ripeness:'ai_ripeness_p', quality:'ai_quality_p'}[tool];
  const current = state.aiCurrent[tool];
  const loading = state.aiLoading[tool];
  const history = state.aiHistory[tool];
  const lang = state.lang;

  let resultsInner = '';
  if(loading){
    resultsInner = `<div class="analyzing"><div class="spinner"></div> ${t('analyzing')}</div>`;
  } else if(current){
    resultsInner = renderResultCard(current.result, lang);
    if(history.length>1){
      resultsInner += `<div class="history-thumb-row">
        ${history.map((h,i)=>`<img class="history-thumb ${h.id===current.id?'active':''}" src="${h.thumb}" onclick="selectHistory('${tool}','${h.id}')">`).join('')}
      </div>`;
    }
  } else {
    resultsInner = `<div class="results-empty">
      <p style="margin-bottom:6px;font-weight:600;color:var(--ink);">${t('no_analyses')}</p>
      <p>${t('no_analyses_sub')}</p>
    </div>`;
  }

  return `
  <div class="container">
    <div class="page-head" style="padding-bottom:0;">
      <div class="breadcrumb"><a href="#/home">${t('breadcrumb_home')}</a> / <a href="#/home" onclick="event.preventDefault();toggleAiDropdown({stopPropagation(){}})">${t('nav_ai')}</a></div>
      <h1>${t(titleKey)}</h1>
      <p>${t(subKey)}</p>
    </div>
    <div class="ai-layout" style="margin-top:26px;">
      <div class="dropzone" id="dz-${tool}"
           ondragover="event.preventDefault(); this.classList.add('drag');"
           ondragleave="this.classList.remove('drag');"
           ondrop="handleDrop(event,'${tool}')">
        ${current && current.thumb ? `<img class="preview" src="${current.thumb}">` : `
        <div class="upload-icon">${ic('upload')}</div>
        <h4>${t('dz_h')}</h4>
        <p>${t('dz_p')}</p>
        <p>${t('dz_hint')}</p>
        `}
        <input type="file" accept="image/png, image/jpeg" onchange="handleFileInput(event,'${tool}')">
      </div>
      <div class="results-panel">
        ${resultsInner}
      </div>
    </div>
  </div>`;
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function processFile(file, tool){
  if(!file) return;
  if(!file.type.match(/image\/(png|jpeg)/)){ showToast('Please upload a JPG or PNG image.'); return; }
  if(file.size > 8*1024*1024){ showToast('Image is larger than 8 MB.'); return; }
  let dataUrl;
  try{ dataUrl = await fileToDataUrl(file); }catch(e){ return; }

  state.aiLoading[tool] = true;
  state.aiCurrent[tool] = { id:'x', thumb:dataUrl, result:null };
  render();

  setTimeout(()=>{
    const result = runAnalysis(tool, file.name+file.size);
    const id = 'a'+Date.now();
    const entry = { id, thumb:dataUrl, result };
    state.aiHistory[tool] = [entry, ...state.aiHistory[tool]].slice(0,6);
    state.aiCurrent[tool] = entry;
    state.aiLoading[tool] = false;
    render();
  }, 1100 + Math.random()*700);
}
function handleFileInput(e, tool){ processFile(e.target.files[0], tool); }
function handleDrop(e, tool){
  e.preventDefault();
  e.currentTarget.classList.remove('drag');
  const file = e.dataTransfer.files[0];
  processFile(file, tool);
}
function selectHistory(tool, id){
  const entry = state.aiHistory[tool].find(h=>h.id===id);
  if(entry){ state.aiCurrent[tool] = entry; render(); }
}

function cartView(){
  const lang = state.lang;
  const items = state.cart.map(c=>{
    const p = PRODUCE.find(pp=>pp.id===c.id);
    return p ? {...c, p} : null;
  }).filter(Boolean);

  if(items.length===0){
    return `
    <div class="container">
      <div class="page-head"><h1>${t('cart_h')}</h1><p>${t('cart_p')}</p></div>
      <div class="empty-state" style="max-width:640px;">

        <button class="btn btn-primary" onclick="go('marketplace')">${t('cart_empty_btn')}</button>
      </div>
    </div>`;
  }

  const subtotal = items.reduce((s,it)=>s+it.p.price*it.qty,0);
  const delivery = items.length ? 49 : 0;
  const taxes = Math.round(subtotal*0.02);
  const total = subtotal + delivery + taxes;

  return `
  <div class="container">
    <div class="page-head"><h1>${t('cart_h')}</h1><p>${t('cart_p')}</p></div>
    <div class="cart-layout">
      <div class="scroll-x">
      <table class="cart-table">
        <thead><tr>
          <th>${t('cart_item')}</th><th>${t('cart_price')}</th><th>${t('cart_qty')}</th><th>${t('cart_subtotal')}</th><th></th>
        </tr></thead>
        <tbody>
        ${items.map(it=>`
          <tr>
            <td>
              <div class="cart-item-name">
                <div class="thumb" style="color:var(--leaf-2)">${ic(it.p.icon)}</div>
                <div>
                  <div style="font-weight:600;">${it.p.name[lang]}</div>
                  <div style="font-size:.8rem;color:var(--ink-muted);">${it.p.location}</div>
                </div>
              </div>
            </td>
            <td>₹${it.p.price} ${t(it.p.unit)}</td>
            <td>
              <div class="qty-stepper">
                <button onclick="changeQty('${it.p.id}',-1)">−</button>
                <span>${it.qty}</span>
                <button onclick="changeQty('${it.p.id}',1)">+</button>
              </div>
            </td>
            <td>₹${it.p.price*it.qty}</td>
            <td><button class="remove-link" onclick="removeFromCart('${it.p.id}')">${t('cart_remove')}</button></td>
          </tr>
        `).join('')}
        </tbody>
      </table>
      </div>
      <div class="cart-summary">
        <h3 style="font-size:1.1rem;margin-bottom:14px;">${t('order_summary')}</h3>
        <div class="cart-summary-row"><span>${t('subtotal')}</span><span>₹${subtotal}</span></div>
        <div class="cart-summary-row"><span>${t('delivery')}</span><span>₹${delivery}</span></div>
        <div class="cart-summary-row"><span>${t('taxes')}</span><span>₹${taxes}</span></div>
        <div class="cart-summary-row total"><span>${t('total')}</span><span>₹${total}</span></div>
        <button class="btn btn-primary" style="width:100%;margin-top:16px;" onclick="showToast('${t('checkout')} — demo only')">${t('checkout')}</button>
      </div>
    </div>
  </div>`;
}

/* =========================================================

   ========================================================= */
function render(){
  const route = currentRoute();
  let body = '';
  if(route==='home') body = homeView();
  else if(route==='marketplace') body = marketplaceView();
  else if(route==='ai-disease') body = aiToolView('disease');
  else if(route==='ai-ripeness') body = aiToolView('ripeness');
  else if(route==='ai-quality') body = aiToolView('quality');
  else if(route==='cart') body = cartView();
  else if(route==='how-it-works') body = howItWorksView();
  else if(route==='about') body = aboutView();
  else if(route==='contact') body = contactView();
  else body = notFoundView();

  const activeMap = {home:'home', marketplace:'marketplace', 'ai-disease':'ai-disease','ai-ripeness':'ai-ripeness','ai-quality':'ai-quality','how-it-works':'how-it-works',about:'about',contact:'contact'};
  const active = activeMap[route] || '';

  document.getElementById('app-root').innerHTML = `
    ${headerHTML(active)}
    <main>${body}</main>
    ${footerHTML()}
    ${searchOverlayHTML()}
    ${loginModalHTML()}
  `;
}
